<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./src/images/favicon-32x32.png">
  <link rel="stylesheet" href="./src/css/reset.css">
  <link rel="stylesheet" href="./src/css/variables.css">
  <link rel="stylesheet" href="./src/css/style.css">
  <title>Frontend Mentor | Profile card component</title>
</head>
<body>
  <main class="container">
    <div class="profile-card">
      <div class="cabecalho">
        <img src="src/images/image-victor.jpg" alt="imagem de perfil">
        <p class="nome">Victor Crest <span class="idade">26</span></p>
        <p class="cidade">London</p>
      </div>  	
      <hr>
        <ul class="rodape">
          <li>
            <p class="info-valor">80k</p>
            <span class="informacao">Followers</span>
          </li>
          <li>
            <p class="info-valor">803k</p>
            <span class="informacao">Likes</span>
          </li>
          <li>
            <p class="info-valor">1.4k</p>
            <span class="informacao">Photos</span>
          </li>
        </ul>
    </div>
  </main>

</body>
</html>
