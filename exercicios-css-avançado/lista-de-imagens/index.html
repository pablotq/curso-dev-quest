<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Exercício de Lista de Imagens">
    <meta name="keywords" content="HTML, CSS">
    <meta name="author" content="Pablotq">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Lista de Imagens</title>

    <link rel="stylesheet" href="src/css/reset.css">
    <link rel="stylesheet" href="src/css/responsive.css">
    <link rel="stylesheet" href="src/css/style.css">

</head>

<body>

    <main>
        <section class="pinturas">
            <div class="imagem">
                <img src="src/imagens/rome.png" alt="pintura Rome de Michelangelo">
                <div class="informacoes">
                    <h2 class="titulo">Rome</h2>
                    <p class="pintor">Michelangelo</p>
                </div>
            </div>
            <div class="imagem">
                <img src="src/imagens/boat.png" alt="pintura Boat at Sea de Vincent Van gogh">
                <div class="informacoes">
                    <h2 class="titulo">Boat at Sea</h2>
                    <p class="pintor">Vincent Van Gogh</p>
                </div>
            </div>
            <div class="imagem">
                <img src="src/imagens/sand-and-sea.png" alt="pintura Sand and Sea de Da Vinci">
                <div class="informacoes">
                    <h2 class="titulo">Sand and Sea</h2>
                    <p class="pintor">Da Vinci</p>
                </div>
            </div>
            <div class="imagem">
                <img src="src/imagens/starry-night.png" alt="pintura Starry Night de Vincent Van Gogh">
                <div class="informacoes">
                    <h2 class="titulo">Starry Night</h2>
                    <p class="pintor">Vincet Van Gogh</p>
                </div>
            </div>
        </section>
    </main>

</body>

</html>
