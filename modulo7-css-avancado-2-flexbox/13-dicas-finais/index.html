<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Aula sobre principais diferenças entre as propriedades justify-content, align-items, align-content e align-self">
    <meta name="keywords" content="HTML, CSS">
    <meta name="author" content="Pablotq">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Dicas Finais de Alinhamento</title>

    <link rel="stylesheet" href="styles/style.css">

</head>
<body>
    
    <h1>Align Item: center</h1>
    <div class="container items">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>

    <h1>Align Content: center</h1>
    <div class="container content">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
    </div>

    <h1>Align Self: center</h1>
    <div class="container">
        <div class="item">Item 1</div>
        <div class="item align-self">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
    </div>
    
</body>
</html>
