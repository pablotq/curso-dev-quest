<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Aula sobre Flex wrap e Flex flow">
    <meta name="keywords" content="HTML, CSS">
    <meta name="author" content="Pablotq">

    <title>Aula sobre Flex wrap e Flex flow</title>

    <link rel="stylesheet" href="styles/globals.css">
    <link rel="stylesheet" href="styles/style.css">

</head>
<body>
    
    <h1>Flex wrap: Nowrap</h1>
    <div class="container nowrap">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>
    
    <h1>Flex wrap: wrap</h1>
    <div class="container wrap">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>
    
    <h1>Flex wrap: wrap-reverse</h1>
    <div class="container wrap-reverse">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>
    
</body>
