<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Módulo de reforço CSS - Como criar um projeto do zero sem travar">
    <meta name="keywords" content="HTML, CSS">
    <meta name="author" content="Pablotq">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NFT preview card component</title>
    <link rel="shortcut icon" href="src/images/favicon-32x32.png" type="image/x-icon">

    <link rel="stylesheet" href="src/css/reset.css">
    <link rel="stylesheet" href="src/css/variables.css">
    <link rel="stylesheet" href="src/css/style.css">

</head>

<body>
    <main>
        <div class="nft-card">
            <a href="#" class="image-link">
                <img class="image" src="src/images/image-equilibrium.jpg" alt="	equilibrium NFT image">
            </a>
            <a class="title-link" href="#">
                <h2 class="title">Equilibrium #3429</h2>
            </a>
            <p class="about">Our Equilibrium collection promotes balance and calm</p>
            <div class="info">
                <p class="price">0.041 ETH</p>
                <p class="days-left">3 days left</p>
            </div>
            <div class="creator">
                <img class="avatar" src="src/images/image-avatar.png" alt="NFT author">
                <p class="text">Creation os <a class="name" href="#">Jules Wyvern</a></p>
            </div>
        </div>
    </main>
</body>

</html>
